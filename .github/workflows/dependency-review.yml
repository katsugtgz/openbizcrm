# OpenBizCRM — Dependency review on PRs
# Action versions verified via GitHub API on 2026-10-18:
#   actions/checkout@v7.0.1, actions/dependency-review-action@v4

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check dependency graph enabled
        id: depgraph
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom)
          echo "SBOM endpoint HTTP $code"
          body=""
          if [ "$code" != "200" ]; then
            body=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom)
          fi
          case "$code" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            # Dependency graph disabled manifests as 403/404 whose body says
            # the graph is disabled ("Not Found" for a repo with no graph).
            # Only those explicit body messages may skip review; anything
            # else (401, 5xx, timeout, unexpected body) is an error and must
            # fail the job rather than silently skip review.
            403|404)
              if echo "$body" | grep -qi 'Code space disabled\|dependency graph.*disabled\|Not Found'; then
                echo "enabled=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::SBOM endpoint returned $code for an unexpected reason (HTTP body does not indicate a disabled dependency graph)."
                exit 1
              fi ;;
            *)
              echo "::error::SBOM endpoint returned HTTP $code; refusing to skip dependency review on an unexpected status."
              exit 1 ;;
          esac

      - name: Dependency review
        if: steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4

      - name: Dependency review skipped (repo setting)
        if: steps.depgraph.outputs.enabled == 'false'
        run: |
          echo "::warning::Dependency graph is disabled for this repository, so dependency review cannot run."
          echo "Enable it: Settings -> Code security -> Dependency graph, then re-run this check."

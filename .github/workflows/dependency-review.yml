# OpenBizCRM — Dependency review on PRs
# Action versions verified via GitHub API on 2026-10-18:
#   actions/checkout@v7.0.1, actions/dependency-review-action@v4

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check dependency graph enabled
        id: depgraph
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom)
          echo "SBOM endpoint HTTP $code"
          case "$code" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            # Dependency graph disabled manifests as 403 whose body says the
            # graph is disabled. A 404 can equally mean an inaccessible repo
            # or token, so it must fail the job instead of skipping review.
            # Anything unexpected (401, 404, 5xx, timeout) is an error and
            # must fail the job rather than silently skip review.
            403)
              if curl -s -H "Authorization: Bearer ${{ github.token }}" \
                https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom \
                | grep -qi 'Code space disabled\|dependency graph.*disabled'; then
                echo "enabled=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::SBOM endpoint returned 403 for an unexpected reason (HTTP body does not indicate a disabled dependency graph)."
                exit 1
              fi ;;
            404)
              echo "::error::SBOM endpoint returned 404: dependency graph may be disabled, but the repo or token could also be inaccessible. Enable the dependency graph and verify token access, then re-run."
              exit 1 ;;
            *)
              echo "::error::SBOM endpoint returned HTTP $code; refusing to skip dependency review on an unexpected status."
              exit 1 ;;
          esac

      - name: Dependency review
        if: steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4

      - name: Dependency review skipped (repo setting)
        if: steps.depgraph.outputs.enabled == 'false'
        run: |
          echo "::warning::Dependency graph is disabled for this repository, so dependency review cannot run."
          echo "Enable it: Settings -> Code security -> Dependency graph, then re-run this check."

# OpenBizCRM — CI
# Action versions verified via GitHub API on 2026-10-18:
#   actions/checkout@v7.0.1, oven-sh/setup-bun@v2.2.0, actions/setup-node@v7.1.0,
#   actions/cache@v6.1.0, actions/upload-artifact@v7.0.2, actions/download-artifact@v6

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Node 22 (Next must never run under the Bun runtime)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: npx --no-install tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Node 22 (Next must never run under the Bun runtime)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest

    # Integration tests (repos.integration.test.ts, RUN_DB_TESTS=1) cover the
    # repo layer; without them the functions-coverage threshold fails.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openbizcrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_DB_TESTS: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/openbizcrm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Node 22 (Next must never run under the Bun runtime)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Push schema to Postgres
        run: bun run db:push

      # Integration tests resolve against seeded rows (seed-owner-1,
      # org_contoh-sejahtera) — seed is idempotent (advisory lock).
      - name: Seed database
        run: bun run db:seed

      - name: Run tests with coverage
        run: npx --no-install vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Node 22 (Next must never run under the Bun runtime)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Next under Node)
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v7.0.2
        with:
          name: next-build
          path: .next/
          retention-days: 3
          # .next is a dot-directory: excluded by default hidden-file rules
          include-hidden-files: true

  e2e-dry-run:
    name: E2E dry run
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Node 22 (Next must never run under the Bun runtime)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v6
        with:
          name: next-build
          path: .next

      - name: Boot server and smoke-test it
        run: |
          npx --no-install next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "App responded on :3000"
              kill "$SERVER_PID"
              exit 0
            fi
            sleep 2
          done
          echo "Server never responded"
          kill "$SERVER_PID"
          exit 1
